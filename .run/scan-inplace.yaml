# Local run config: one-shot scan that renames files in place (no moving).
# Files keep their folder; only the file name (and related files) is changed via the tag system's FileName.
# Usage: java --enable-preview -jar build/libs/aniadd-cli-all-<version>.jar run -c .run/scan-inplace.yaml
# Required env: ANIDB_USERNAME, ANIDB_PASSWORD, TVDB_APIKEY, TMDB_ACCESS_TOKEN
# (credentials and API keys are rejected if put in this file)
run:
  task: scan
  args:
    path: ../library/input/

anidb:
  cache:
    db: ../aniAdd.sqlite
    ttlInDays: 30
  exitOnBan: false
  localPort: 3333

file:
  move:
    # none: target folder is the file's current folder, so rename happens in place
    deleteEmptyDirs: false
    mode: none
    # unknown handling ignores move.mode, so it must be disabled explicitly to keep files in place
    unknown:
      mode: none
    # duplicates are only handled when moving; with mode none an existing target means the name is already correct
    duplicates:
      mode: none
  mylist:
    add: false
    overwrite: false
    storageType: remote
    watched: false
  rename:
    mode: tagsystem
    related: true

kodi:
  pathFilter: anime
  port: 9090
  metadata:
    generate: true

tags:
  paths:
    movieFolders:
      - path: ../library/output/movies/
        tagSystemName: BaseMoviePath
    tvShowFolders:
      - path: ../library/output/series/
        tagSystemName: BaseTVShowPath
  tagSystemFile: ../config/tagging-system.kodi.txt
