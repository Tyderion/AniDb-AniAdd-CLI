# See Readme.md for more information
run:
  tasks:
    - watch
  args:
    path: /from/anidb

anidb:
  cache:
    # Absolute on purpose. A relative path resolves against this file, so a mounted config would put the
    # cache beside itself, often on a read-only mount. Mount a writable volume here and keep it across
    # upgrades: starting from an empty cache means looking every file up again, which is what gets an
    # account banned. LOCAL_CACHE_FILE overrides it for the entrypoint scripts.
    db: /cache/aniAdd.sqlite
    ttlInDays: 30
  exitOnBan: false
  localPort: 3333

file:
  move:
    deleteEmptyDirs: true
    mode: tagsystem
    unknown:
      folder: /unknown
      mode: none
    duplicates:
      folder: /duplicates
      mode: none
  mylist:
    add: true
    overwrite: false
    storageType: remote
    watched: false
  rename:
    mode: tagsystem
    related: true

kodi:
  pathFilter: anime
  port: 9090

# Re-encode video into one output format, leaving audio, subtitles, attachments and chapters alone.
# Files are identified on AniDB first and only then converted, so nothing unknown is ever encoded.
# The new file's ed2k hash and size are mapped back to the original's in the sqlite cache, which is
# how identification, MyList and the tag system keep working as if the file had never changed format.
transcode:
  enabled: false
  # Matched against the video codec as ffprobe names it.
  videoCodecs:
    - h264
  # PROVISIONAL default, never benchmarked against a real library. Tune it before you trust it.
  videoArgs: "-c:v libx265 -crf 23 -preset medium -pix_fmt yuv420p10le"
  # Everything that is not video is copied, so the video re-encode is the only lossy step.
  streamArgs: "-map 0 -c:a copy -c:s copy -c:t copy -map_metadata 0 -map_chapters 0"
  # Encodes run one at a time. nice keeps them off the rest of the machine's back.
  nice: 10
  timeoutMinutes: 480
  # A converted file replaces its source only if ffmpeg exits 0, the duration still matches, the output
  # is not suspiciously small, and no stream went missing.
  durationToleranceSeconds: 1.0
  minSizeRatio: 0.05
  # What happens to the source once the converted file passed verification: move, delete or none.
  # move needs a folder. With none, the converted file gets its own name so nothing is overwritten.
  original:
    mode: move
    folder: /originals

tags:
  paths:
    movieFolders:
      - path: /movies
        tagSystemName: BaseMoviePath
    tvShowFolders:
      - path: /shows
        tagSystemName: BaseTVShowPath
  tagSystem: |-
    # Names anime in the following format "ShowTitle S01EXX EpisodeTitle [Group][Source][Resolution][Codec][CRC]""
    # Kodi should parse those episode numbers correctly
    # Contains anime with names that kodi anidb info provider cannot handle: 86
    ForceEnglishNames:=",15441," # Comma delimited list of anime IDs to force English names, start and end with , (=SEP)
    SEP:=","
    # Use Romanized show title for all except the anime in the list above
    ShowTitle:={$indexof(%ForceEnglishNames%, %SEP% %AId% %SEP%) = "-1" ? [%ATr%, %ATe%, %ATk%] : [%ATe%, %ATr%, %ATk%]}
    EpisodeTitle:=[%ETe%, %ETr%, %ETk%]
    ShowTitle:=$repl(%ShowTitle%, "\?|\s*\.+$", "_")
    ShowTitle:=$repl(%ShowTitle%, '[\\":/*|<>?]', " ")
    EpisodeTitle:=$repl(%EpisodeTitle%, '[\\":/*|<>?]', " ")
    ShowTitle:=$repl(%ShowTitle%, "\s+", " ")
    EpisodeTitle:=$repl(%EpisodeTitle%, "\s+", " ")
    ShowTitle:=$repl(%ShowTitle%, "^\s|\s$", "")
    EpisodeTitle:=$repl(%EpisodeTitle%, "^\s|\s$", "")
    ShowTitle:=$repl(%ShowTitle%, "`", "'")
    EpisodeTitle:=$repl(%EpisodeTitle%, "`", "'")
    Trunc(str, len):=$repl(%str%, ".{" $len($repl(%str%, "(.?){" %len% "}$", "")) "}$", "")
    TruncEllipse(str, len):={$len(%str%) = $len($Trunc(%str%, %len%)) ? %str% : $Trunc(%str%, %len%) "…" }
    EpisodeTitle:=$TruncEllipse(%EpisodeTitle%, "64")
    Regular:="S01E"
    Special:="S00E"
    Separator:=" "
    SpecialEp:=$repl(%EpNo%, "[1234567890]", "")
    EpNo:=$repl(%EpNo%, "[SCTPO]", "")
    Ver:={%Ver% = "1" ? "" : "v" %Ver% }
    Pad:={%SpecialEp% ? "2" : $max($len(%EpHiNo%), $len(%EpCount%)) }
    Pad:={$match(%EpCount%, "0") ? $max("2", %Pad%) : %Pad% }
    EpNoPad:=$pad(%EpNo%, %Pad%, "0")
    EpNoPad:={%SpecialEp%       ? %EpNoPad%  :  %Regular%   %EpNoPad% }
    EpNoPad:={%SpecialEp% = "S" ? %Special%     %EpNoPad% : %EpNoPad% }
    EpNoPad:={%SpecialEp% = "C" ? %Special% "1" %EpNoPad% : %EpNoPad% }
    EpNoPad:={%SpecialEp% = "T" ? %Special% "2" %EpNoPad% : %EpNoPad% }
    EpNoPad:={%SpecialEp% = "P" ? %Special% "3" %EpNoPad% : %EpNoPad% }
    EpNoPad:={%SpecialEp% = "O" ? %Special% "4" %EpNoPad% : %EpNoPad% }
    EpNoFull:=%Separator% %EpNoPad% %Ver% %Separator%
    GT:="[" [%GTs%, %GTl%] "]"
    Src:="[" $repl(%Source%, "B-R|Blu-ray", "BluRay") "]"
    Cen:={%Cen% ? "[Cen]" : "" }
    Res:="[" %FVideoRes% "]"
    VCodec:="[" $repl(%FVCodec%,"H264/AVC","h264") "]"
    ACodec:="[" %FACodec% "]"
    CRC:="[" $uc(%FCrc%) "]"
    FileInfo:=" " %GT% %Src% %Cen% %Res% %VCodec% %CRC%
    MovieTypes:="Movie|OVA"
    IsMovie:={$match(%Type%, %MovieTypes%) ? {%EpCount% = "1" ? {%SpecialEp% ? "" : "1" } : "" } : "" }
    MovieFileName:=%ShowTitle% %FileInfo%
    TVShowFileName:=%ShowTitle% %EpNoFull% %EpisodeTitle% %FileInfo%
    BasePath:={%IsMovie% ? %BaseMoviePath% : %BaseTVShowPath% }
    FileName:={%IsMovie% ? %MovieFileName% : %TVShowFileName% }
    PathName:=%BasePath% %ShowTitle%
