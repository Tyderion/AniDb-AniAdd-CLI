# Overrides merged on top of .run/scan-local.yaml to produce sandbox/sandbox.yaml.
# Keeping this a diff rather than a whole config means the tag system lives in exactly one place.
# Every path here is relative to the generated file, which sits in the sandbox directory, so nothing
# needs to know where the container lives and the result is readable.

anidb:
  cache:
    # The shared production cache on purpose: a separate sandbox DB would force a fresh AniDB lookup
    # for every file copied in, which is exactly the traffic that earns a ban.
    db: ../aniAdd.sqlite
    ttlInDays: 30
  exitOnBan: true

file:
  move:
    mode: tagsystem
    deleteEmptyDirs: false
    unknown:
      folder: unknown/
      mode: move
    duplicates:
      folder: duplicates/
      mode: move
  mylist:
    # Hard gate. A sandbox run must never touch the real MyList.
    add: false
    overwrite: false
    watched: false
  rename:
    mode: tagsystem
    related: true

kodi:
  metadata:
    generate: true
  # Ignored on branches that predate the library-scan feature, which is the point: the parser skips
  # keys it does not know, so one generated config works in every worktree.
  libraryScan:
    enabled: false

tags:
  paths:
    movieFolders:
      - path: output/movies/
        tagSystemName: BaseMoviePath
    tvShowFolders:
      - path: output/series/
        tagSystemName: BaseTVShowPath
